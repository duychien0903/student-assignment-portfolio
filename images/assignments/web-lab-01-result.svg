<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <!-- Browser Chrome Window -->
  <rect width="800" height="500" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect width="800" height="42" rx="12" fill="#FFFFFF"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#E2E8F0" stroke-width="1"/>
  
  <circle cx="20" cy="21" r="5" fill="#EF4444"/>
  <circle cx="36" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="52" cy="21" r="5" fill="#10B981"/>

  <!-- Address Bar -->
  <rect x="80" y="8" width="560" height="26" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="100" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">
    https://localhost:3000/lab01-preview.html (實作畫面成果)
  </text>

  <!-- Web Page Rendered Content -->
  <!-- Header Bar -->
  <rect x="24" y="60" width="752" height="56" rx="10" fill="#1E3A8A"/>
  <circle cx="54" cy="88" r="14" fill="#3B82F6"/>
  <text x="80" y="93" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">資訊科技實作展示系統</text>
  <rect x="660" y="74" width="96" height="28" rx="6" fill="#3B82F6"/>
  <text x="708" y="92" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">作業已驗證</text>

  <!-- 3-Column Responsive Grid Cards -->
  <g transform="translate(24, 136)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="234" height="220" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="234" height="100" rx="10" fill="#EFF6FF"/>
    <path d="M 20 80 L 80 40 L 140 70 L 214 30" stroke="#3B82F6" stroke-width="3" fill="none"/>
    <text x="18" y="130" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#0F172A">模組一：佈局實作</text>
    <text x="18" y="152" font-family="'Noto Sans TC', sans-serif" font-size="11.5" fill="#64748B">使用 CSS Flexbox 與 Grid 達成完美排版。</text>
    <rect x="18" y="174" width="70" height="22" rx="4" fill="#DCFCE7"/>
    <text x="53" y="189" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="700" fill="#15803D">已通過測試</text>

    <!-- Card 2 -->
    <rect x="259" y="0" width="234" height="220" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="259" y="0" width="234" height="100" rx="10" fill="#F8FAFC"/>
    <rect x="280" y="24" width="190" height="14" rx="3" fill="#CBD5E1"/>
    <rect x="280" y="46" width="140" height="14" rx="3" fill="#E2E8F0"/>
    <rect x="280" y="68" width="170" height="14" rx="3" fill="#E2E8F0"/>
    <text x="277" y="130" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#0F172A">模組二：互動元件</text>
    <text x="277" y="152" font-family="'Noto Sans TC', sans-serif" font-size="11.5" fill="#64748B">JavaScript DOM 監聽事件及動態渲染。</text>
    <rect x="277" y="174" width="70" height="22" rx="4" fill="#DCFCE7"/>
    <text x="312" y="189" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="700" fill="#15803D">已通過測試</text>

    <!-- Card 3 -->
    <rect x="518" y="0" width="234" height="220" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="518" y="0" width="234" height="100" rx="10" fill="#EFF6FF"/>
    <circle cx="635" cy="50" r="30" fill="#DBEAFE"/>
    <path d="M 625 50 L 632 57 L 647 42" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="536" y="130" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#0F172A">模組三：響應式斷點</text>
    <text x="536" y="152" font-family="'Noto Sans TC', sans-serif" font-size="11.5" fill="#64748B">行動裝置 Media Query 斷點切換良好。</text>
    <rect x="536" y="174" width="70" height="22" rx="4" fill="#DCFCE7"/>
    <text x="571" y="189" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="700" fill="#15803D">已通過測試</text>
  </g>

  <!-- Student Watermark Tag -->
  <rect x="24" y="380" width="752" height="42" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="406" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#475569">
    實作者：裴維戰 (學號：1111310133) • 資訊科技應用系 • 瀏覽器渲染測試無異常
  </text>
