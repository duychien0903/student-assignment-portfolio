<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect width="800" height="38" rx="12" fill="#1E293B"/>
  <circle cx="20" cy="19" r="6" fill="#EF4444"/>
  <circle cx="38" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="56" cy="19" r="6" fill="#10B981"/>
  <text x="400" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">
    MySQL Workbench — ER Diagram: StudentCourseDB • 裴維戰
  </text>

  <!-- ER Diagram Canvas -->
  <!-- Table 1: students -->
  <g transform="translate(60, 80)">
    <rect width="200" height="200" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <rect width="200" height="36" rx="8" fill="#2563EB"/>
    <text x="14" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF">students (學生表)</text>
    
    <text x="14" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FCD34D">🔑 student_id : VARCHAR(10) [PK]</text>
    <text x="14" y="88" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">　 name : VARCHAR(50)</text>
    <text x="14" y="114" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">　 department : VARCHAR(50)</text>
    <text x="14" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">　 grade : INT</text>
    <text x="14" y="166" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">　 created_at : DATETIME</text>
  </g>

  <!-- Table 2: courses -->
  <g transform="translate(540, 80)">
    <rect width="200" height="200" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <rect width="200" height="36" rx="8" fill="#059669"/>
    <text x="14" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF">courses (課程表)</text>
    
    <text x="14" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FCD34D">🔑 course_id : VARCHAR(10) [PK]</text>
    <text x="14" y="88" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">　 title : VARCHAR(100)</text>
    <text x="14" y="114" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">　 credits : INT</text>
    <text x="14" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">　 instructor : VARCHAR(50)</text>
    <text x="14" y="166" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">　 semester : VARCHAR(10)</text>
  </g>

  <!-- Table 3: enrollments (Relation) -->
  <g transform="translate(300, 260)">
    <rect width="200" height="180" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <rect width="200" height="36" rx="8" fill="#D97706"/>
    <text x="14" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF">enrollments (選課表)</text>
    
    <text x="14" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FCD34D">🔑 id : INT AUTO_INC [PK]</text>
    <text x="14" y="88" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60A5FA">🔗 student_id : VARCHAR(10) [FK]</text>
    <text x="14" y="114" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">🔗 course_id : VARCHAR(10) [FK]</text>
    <text x="14" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">　 score : DECIMAL(5,2)</text>
  </g>

  <!-- Relationship Connector Lines -->
  <path d="M 160 280 L 160 350 L 300 350" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M 640 280 L 640 350 L 500 350" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
  
  <rect x="250" y="450" width="300" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="471" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#38BDF8">
    關聯資料庫正規化設計完成 • 滿足第三正規化 (3NF)
  </text>
</svg>
