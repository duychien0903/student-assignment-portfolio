<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" rx="12" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Terminal Header -->
  <rect width="800" height="38" rx="12" fill="#1E293B"/>
  <circle cx="20" cy="19" r="6" fill="#EF4444"/>
  <circle cx="38" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="56" cy="19" r="6" fill="#10B981"/>
  <text x="400" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">
    Terminal — mysql client • 裴維戰 (1111310133)
  </text>

  <!-- Query Text and Output -->
  <g transform="translate(24, 60)" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12.5">
    <text x="0" y="20" fill="#38BDF8">mysql&gt; <tspan fill="#F59E0B">SELECT</tspan> s.student_id, s.name, c.title, e.score</text>
    <text x="0" y="44" fill="#38BDF8">    -&gt; <tspan fill="#F59E0B">FROM</tspan> students s</text>
    <text x="0" y="68" fill="#38BDF8">    -&gt; <tspan fill="#F59E0B">JOIN</tspan> enrollments e <tspan fill="#F59E0B">ON</tspan> s.student_id = e.student_id</text>
    <text x="0" y="92" fill="#38BDF8">    -&gt; <tspan fill="#F59E0B">JOIN</tspan> courses c <tspan fill="#F59E0B">ON</tspan> e.course_id = c.course_id</text>
    <text x="0" y="116" fill="#38BDF8">    -&gt; <tspan fill="#F59E0B">WHERE</tspan> s.student_id = <tspan fill="#4ADE80">'1111310133'</tspan>;</text>

    <!-- Table Frame -->
    <text x="0" y="156" fill="#64748B">+------------+-----------+----------------------+-------+</text>
    <text x="0" y="178" fill="#F8FAFC">| student_id | name      | title                | score |</text>
    <text x="0" y="200" fill="#64748B">+------------+-----------+----------------------+-------+</text>
    <text x="0" y="222" fill="#93C5FD">| 1111310133 | 裴維戰    | 網頁前端設計與應用   | 95.00 |</text>
    <text x="0" y="244" fill="#93C5FD">| 1111310133 | 裴維戰    | 關聯式資料庫系統     | 92.50 |</text>
    <text x="0" y="266" fill="#93C5FD">| 1111310133 | 裴維戰    | 物件導向程式設計     | 94.00 |</text>
    <text x="0" y="288" fill="#64748B">+------------+-----------+----------------------+-------+</text>
    <text x="0" y="320" fill="#4ADE80">3 rows in set (0.002 sec)</text>

    <text x="0" y="360" fill="#38BDF8">mysql&gt; <tspan fill="#A78BFA">-- 實作驗證成功：SQL 查詢資料關聯整合無誤</tspan></text>
    <text x="0" y="390" fill="#38BDF8">mysql&gt; <tspan fill="#4ADE80">status;</tspan></text>
    <text x="0" y="415" fill="#94A3B8">Connection id: 14 | Current database: StudentCourseDB | User: root@localhost</text>
  </g>
